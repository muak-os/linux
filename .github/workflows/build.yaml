name: Build Linux

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      latest:
        description: "Tag the image as latest"
        required: false
        type: boolean
        default: true
      tag:
        description: "Tag to build (defaults to current commit)"
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      REGISTRY: ghcr.io/muak-os
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af
          df -h

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup kernel signing key
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          if [[ -n "${KERNEL_SIGNING_KEY}" ]]; then
            echo "${KERNEL_SIGNING_KEY}" > /tmp/kernel-signing-key.pem
            chmod 600 /tmp/kernel-signing-key.pem
          fi

      - name: Build linux (${{ matrix.arch }})
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          KERNEL_SIGNING_ARG=""
          if [[ -n "${KERNEL_SIGNING_KEY}" ]]; then
            KERNEL_SIGNING_ARG="--secret id=kernel_key,src=/tmp/kernel-signing-key.pem"
          fi
          CONTAINER_RUNTIME=docker \
          ARCH=${{ matrix.arch }} \
          PUSH=true \
          LATEST=${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.latest) }} \
          TAG=${{ steps.tag.outputs.tag }} \
          KERNEL_SIGNING="${KERNEL_SIGNING_ARG}" \
          just build

      - name: Cleanup kernel signing key
        if: always()
        env:
          KERNEL_SIGNING_KEY: ${{ secrets.KERNEL_SIGNING_KEY }}
        run: |
          if [[ -n "${KERNEL_SIGNING_KEY}" ]]; then
            rm -f /tmp/kernel-signing-key.pem
          fi

      - name: Build summary
        run: |
          echo "### linux (${{ matrix.arch }}) Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ env.REGISTRY }}/linux:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}\`" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Combine multi-arch manifest
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/muak-os
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch manifest (${{ steps.tag.outputs.tag }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LATEST: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/linux:${TAG}" \
            "${REGISTRY}/linux:${TAG}-amd64" \
            "${REGISTRY}/linux:${TAG}-arm64"

          if [ "${LATEST}" = "true" ]; then
            docker buildx imagetools create \
              --tag "${REGISTRY}/linux:latest" \
              "${REGISTRY}/linux:latest-amd64" \
              "${REGISTRY}/linux:latest-arm64"
          fi

      - name: Build summary
        run: |
          echo "### Multi-arch manifest created" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ env.REGISTRY }}/linux:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Sources:** \`${{ env.REGISTRY }}/linux:${{ steps.tag.outputs.tag }}-amd64\`, \`${{ env.REGISTRY }}/linux:${{ steps.tag.outputs.tag }}-arm64\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.latest) }}" == "true" ]]; then
            echo "- **Latest:** \`${{ env.REGISTRY }}/linux:latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
